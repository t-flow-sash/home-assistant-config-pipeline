name: Validate template and Home Assistant configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Plan risk-based checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/select_ci_checks.py --base "$BASE_SHA" --head HEAD --github-output "$GITHUB_OUTPUT"

      - name: Parse Home Assistant YAML
        run: python scripts/validate_ha_yaml.py

      - name: Reject secrets and runtime state
        run: python scripts/security_check.py

      - name: Run pipeline tests
        run: >-
          python -m unittest -v
          tests.test_release_safety
          tests.test_security_check
          tests.test_select_ci_checks
          tests.test_validate_ha_yaml

      - name: Run selected user contract tests
        if: steps.plan.outputs.has_tests == 'true'
        env:
          SELECTED_TESTS_JSON: ${{ steps.plan.outputs.tests_json }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          tests = json.loads(os.environ["SELECTED_TESTS_JSON"])
          subprocess.run([sys.executable, "-m", "unittest", "-v", *tests], check=True)
          PY

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          else
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          fi

      - name: Install verified Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$ARCHIVE"
          echo "$GITLEAKS_SHA256  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks

      - name: Scan repository with Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose .

      - name: Strict security gate - scan complete Git history
        if: steps.plan.outputs.strict_security == 'true'
        run: |
          echo "Security-sensitive change detected; scanning complete Git history."
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
